[package]
name = "aram-balance-checker"
description = "ARAM Balance Checker: ARAM and ARAM: Mayhem balance of the champions in your champion select"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "aram_balance_checker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
aram-lcu = { path = "../lcu" }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
